changelog: >
  The album catalogue is steadier when MusicBrainz is busy: a busy answer is retried and never remembered as an empty result, and the next lookup recovers sooner.
  An album's disc count now follows what most editions have.
  A requester is notified only when the album has arrived.
  The admin page and README use clearer wording.
