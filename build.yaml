overview: "Music requests for the Sillon app."
description: >
  Sillon connects Jellyfin to Lidarr so music requests made from the Sillon app
  can be fulfilled automatically.
category: "Music"
changelog: >
  A search also finds albums by the title of a song, through MusicBrainz, and a new endpoint lists an album's tracks.
  Every same-title release group is offered, with what tells them apart; singles are hidden by default.
  A waiting request tells whether it is still searching or not found yet.
  A failed request recovers on its own once its album is imported.
  Requesting an album monitors its artist; cancelling a request unmonitors the album.
