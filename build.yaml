description: >
  Sillon connects Jellyfin to Lidarr so music requests made from the Sillon app
  can be fulfilled automatically.
category: "Music"
changelog: >
  Redesigned administration page (tabs, guided Lidarr setup, request list with covers).
  Device tokens are bound to their owner: registering a token held by another user is refused (409).
  New relay notification mode (relay / direct / off): notifications are end-to-end encrypted, the relay cannot read their content.
  The catalogue prefers the album over a same-title single or EP of the same artist.
