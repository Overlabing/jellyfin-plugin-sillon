name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.Sillon/Jellyfin.Plugin.Sillon.csproj -c Release -o publish

      - name: Stage plugin folder
        run: |
          mkdir -p Sillon_0.5.0.0
          cp publish/Jellyfin.Plugin.Sillon.dll Sillon_0.5.0.0/

      - uses: actions/upload-artifact@v4
        with:
          name: Sillon_0.5.0.0
          path: Sillon_0.5.0.0/Jellyfin.Plugin.Sillon.dll
