<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sillon</title>
</head>
<body>
<div id="SillonConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox,emby-textarea">
    <div data-role="content">
        <div class="content-primary">
            <style>
                #SillonConfigPage { --sl-accent: #00a4dc; --sl-ok: #4cc664; --sl-warn: #e3b341; --sl-bad: #ff7b72; --sl-card: rgba(128, 128, 128, .13); --sl-line: rgba(128, 128, 128, .30); --sl-muted: .68; }
                #SillonConfigPage[data-theme="light"] { --sl-accent: #0087b8; --sl-ok: #1a7f37; --sl-warn: #9a6700; --sl-bad: #cf222e; --sl-card: rgba(0, 0, 0, .045); --sl-line: rgba(0, 0, 0, .16); --sl-muted: .72; }
                #SillonConfigPage * { box-sizing: border-box; }
                #SillonConfigPage .sl-shell { max-width: 62em; margin: 0 auto; padding-bottom: 6em; }
                #SillonConfigPage [hidden] { display: none !important; }
                #SillonConfigPage .sl-muted { opacity: var(--sl-muted); }
                #SillonConfigPage .sl-small { font-size: .88em; }

                /* header */
                #SillonConfigPage .sl-head { display: flex; align-items: center; gap: .9em; margin: .2em 0 1.2em; }
                #SillonConfigPage .sl-logo { flex: none; width: 2.9em; height: 2.9em; border-radius: .8em; display: grid; place-items: center; background: linear-gradient(135deg, #00a4dc, #7b61ff); color: #fff; }
                #SillonConfigPage .sl-logo .material-icons { font-size: 1.7em; }
                #SillonConfigPage .sl-head h1 { margin: 0; font-size: 1.7em; line-height: 1.15; }
                #SillonConfigPage .sl-head p { margin: .15em 0 0; }
                #SillonConfigPage .sl-version { margin-inline-start: auto; align-self: flex-start; }

                /* tabs */
                #SillonConfigPage .sl-tabs { display: flex; gap: .3em; overflow-x: auto; border-bottom: 1px solid var(--sl-line); margin-bottom: 1.6em; scrollbar-width: none; }
                #SillonConfigPage .sl-tabs::-webkit-scrollbar { display: none; }
                #SillonConfigPage .sl-tab { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: .45em; padding: .75em 1.05em; white-space: nowrap; opacity: var(--sl-muted); border-bottom: 3px solid transparent; margin-bottom: -1px; font-weight: 500; }
                #SillonConfigPage .sl-tab:hover { opacity: 1; background: var(--sl-card); border-radius: .5em .5em 0 0; }
                #SillonConfigPage .sl-tab:focus-visible { outline: 2px solid var(--sl-accent); outline-offset: -2px; }
                #SillonConfigPage .sl-tab[aria-selected="true"] { opacity: 1; border-bottom-color: var(--sl-accent); font-weight: 600; }
                #SillonConfigPage .sl-tab .material-icons { font-size: 1.25em; }
                #SillonConfigPage .sl-dot { width: .55em; height: .55em; border-radius: 50%; background: var(--sl-bad); }

                /* headings, cards */
                #SillonConfigPage h2.sl-title { margin: 0 0 .25em; font-size: 1.35em; }
                #SillonConfigPage .sl-lead { margin: 0 0 1.5em; max-width: 42em; opacity: var(--sl-muted); }
                #SillonConfigPage .sl-card { background: var(--sl-card); border: 1px solid var(--sl-line); border-radius: .9em; padding: 1.2em 1.3em; margin-bottom: 1.2em; }
                #SillonConfigPage .sl-card > h3 { margin: 0 0 .2em; font-size: 1.1em; font-weight: 600; }
                #SillonConfigPage .sl-card > .sl-sub { margin: 0 0 1em; opacity: var(--sl-muted); }
                #SillonConfigPage .sl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15em, 1fr)); gap: 1.1em; margin-bottom: 1.2em; }
                #SillonConfigPage .sl-grid > .sl-card { margin: 0; display: flex; flex-direction: column; gap: .5em; }
                #SillonConfigPage .sl-card-head { display: flex; align-items: center; gap: .6em; font-weight: 600; }
                #SillonConfigPage .sl-card-head .material-icons { opacity: .85; }
                #SillonConfigPage .sl-card p { margin: 0; }
                #SillonConfigPage .sl-card .sl-cta { margin-top: auto; padding-top: .5em; }
                #SillonConfigPage .sl-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5em, 1fr)); gap: 1em; }
                #SillonConfigPage .sl-stat { text-align: start; background: none; border: 1px solid var(--sl-line); border-radius: .7em; padding: .8em 1em; cursor: pointer; color: inherit; font: inherit; }
                #SillonConfigPage .sl-stat:hover { background: var(--sl-card); }
                #SillonConfigPage .sl-stat:focus-visible { outline: 2px solid var(--sl-accent); }
                #SillonConfigPage .sl-stat b { display: block; font-size: 2em; font-weight: 600; line-height: 1.1; }
                #SillonConfigPage .sl-stat span { opacity: var(--sl-muted); }
                #SillonConfigPage .sl-stat.warn b { color: var(--sl-bad); }

                /* chips */
                #SillonConfigPage .sl-chip { display: inline-flex; align-items: center; gap: .35em; padding: .18em .75em; border-radius: 2em; font-size: .85em; font-weight: 600; background: rgba(128, 128, 128, .22); white-space: nowrap; }
                #SillonConfigPage .sl-chip .material-icons { font-size: 1.15em; }
                #SillonConfigPage .sl-chip.ok, #SillonConfigPage .sl-chip.available { color: var(--sl-ok); background: color-mix(in srgb, var(--sl-ok) 17%, transparent); }
                #SillonConfigPage .sl-chip.warn, #SillonConfigPage .sl-chip.requested { color: var(--sl-warn); background: color-mix(in srgb, var(--sl-warn) 17%, transparent); }
                #SillonConfigPage .sl-chip.bad, #SillonConfigPage .sl-chip.failed { color: var(--sl-bad); background: color-mix(in srgb, var(--sl-bad) 17%, transparent); }
                #SillonConfigPage .sl-chip.info, #SillonConfigPage .sl-chip.downloading { color: var(--sl-accent); background: color-mix(in srgb, var(--sl-accent) 17%, transparent); }

                /* notes and banners */
                #SillonConfigPage .sl-note { display: flex; gap: .7em; align-items: flex-start; padding: .8em 1em; border-radius: .7em; margin: 0 0 1.2em; background: color-mix(in srgb, var(--sl-accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--sl-accent) 35%, transparent); }
                #SillonConfigPage .sl-note.bad { background: color-mix(in srgb, var(--sl-bad) 12%, transparent); border-color: color-mix(in srgb, var(--sl-bad) 40%, transparent); }
                #SillonConfigPage .sl-note.ok { background: color-mix(in srgb, var(--sl-ok) 12%, transparent); border-color: color-mix(in srgb, var(--sl-ok) 40%, transparent); }
                #SillonConfigPage .sl-note .material-icons { flex: none; }
                #SillonConfigPage .sl-note > div { flex: 1 1 auto; min-width: 0; }
                #SillonConfigPage .sl-inline { min-height: 1.4em; margin-top: .5em; }
                #SillonConfigPage .sl-inline.ok { color: var(--sl-ok); }
                #SillonConfigPage .sl-inline.bad, #SillonConfigPage .sl-field-error { color: var(--sl-bad); }
                #SillonConfigPage .sl-field-error { font-size: .88em; min-height: 1.2em; }

                /* steps */
                #SillonConfigPage .sl-step { display: flex; gap: 1em; padding: 1em 0; border-top: 1px solid var(--sl-line); }
                #SillonConfigPage .sl-step:first-of-type { border-top: 0; padding-top: .2em; }
                #SillonConfigPage .sl-num { flex: none; width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; font-weight: 600; border: 2px solid var(--sl-line); }
                #SillonConfigPage .sl-step.done .sl-num { background: var(--sl-ok); border-color: var(--sl-ok); color: #fff; }
                #SillonConfigPage .sl-step.todo .sl-num { border-color: var(--sl-accent); color: var(--sl-accent); }
                #SillonConfigPage .sl-step.locked { opacity: .5; }
                #SillonConfigPage .sl-step-body { flex: 1 1 auto; min-width: 0; }
                #SillonConfigPage .sl-step-body h4 { margin: .2em 0 .15em; font-size: 1.05em; font-weight: 600; }
                #SillonConfigPage .sl-step-body > p { margin: 0 0 .7em; opacity: var(--sl-muted); }
                #SillonConfigPage .sl-step .inputContainer, #SillonConfigPage .sl-step .selectContainer { max-width: 32em; }

                /* forms */
                #SillonConfigPage .sl-form .inputContainer, #SillonConfigPage .sl-form .selectContainer { max-width: 32em; margin-bottom: 1.2em; }
                #SillonConfigPage .sl-form .checkboxContainer { margin-bottom: 1.2em; }
                #SillonConfigPage .sl-row { display: flex; flex-wrap: wrap; gap: .7em; align-items: center; }
                #SillonConfigPage details.sl-adv { border-top: 1px solid var(--sl-line); margin-top: 1em; padding-top: .8em; }
                #SillonConfigPage details.sl-adv > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: .4em; padding: .3em 0; opacity: var(--sl-muted); }
                #SillonConfigPage details.sl-adv > summary::-webkit-details-marker { display: none; }
                #SillonConfigPage details.sl-adv > summary::before { content: "chevron_right"; font-family: "Material Icons"; font-size: 1.4em; transition: transform .15s; }
                #SillonConfigPage details.sl-adv[open] > summary::before { transform: rotate(90deg); }
                #SillonConfigPage details.sl-adv[open] > summary { opacity: 1; }
                #SillonConfigPage details.sl-adv > .sl-adv-body { padding-top: .8em; }
                #SillonConfigPage .sl-chips { display: flex; flex-wrap: wrap; gap: .5em; margin: .4em 0 0; }
                #SillonConfigPage .sl-pick { all: unset; box-sizing: border-box; cursor: pointer; padding: .4em 1em; border-radius: 2em; border: 1px solid var(--sl-line); font-weight: 500; }
                #SillonConfigPage .sl-pick:hover { background: var(--sl-card); }
                #SillonConfigPage .sl-pick:focus-visible { outline: 2px solid var(--sl-accent); }
                #SillonConfigPage .sl-pick[aria-pressed="true"] { background: var(--sl-accent); border-color: var(--sl-accent); color: #fff; }
                #SillonConfigPage .sl-search { max-width: 20em; flex: 1 1 12em; margin: 0 !important; }

                /* lists */
                #SillonConfigPage .sl-mode { margin: 0 0 .9em; }
                #SillonConfigPage .sl-list { list-style: none; margin: 0; padding: 0; }
                #SillonConfigPage .sl-item { display: flex; align-items: center; gap: 1em; padding: .85em .3em; border-bottom: 1px solid var(--sl-line); }
                #SillonConfigPage .sl-item:last-child { border-bottom: 0; }
                #SillonConfigPage .sl-cover { flex: none; width: 3.9em; height: 3.9em; border-radius: .5em; object-fit: cover; background: var(--sl-card); display: grid; place-items: center; overflow: hidden; border: 1px solid var(--sl-line); }
                #SillonConfigPage .sl-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
                #SillonConfigPage .sl-cover .material-icons { opacity: .5; font-size: 1.8em; }
                #SillonConfigPage .sl-avatar { flex: none; width: 2.6em; height: 2.6em; border-radius: 50%; display: grid; place-items: center; font-weight: 600; background: color-mix(in srgb, var(--sl-accent) 22%, transparent); color: var(--sl-accent); }
                #SillonConfigPage .sl-main { flex: 1 1 auto; min-width: 0; }
                #SillonConfigPage .sl-main b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
                #SillonConfigPage .sl-main span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: var(--sl-muted); font-size: .92em; }
                #SillonConfigPage .sl-main span.sl-wrap { white-space: normal; }
                #SillonConfigPage .sl-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: .45em; }
                #SillonConfigPage .sl-actions { display: flex; flex-wrap: wrap; gap: .4em; justify-content: flex-end; }
                #SillonConfigPage .sl-actions button { margin: 0; }
                #SillonConfigPage .sl-bar { height: .3em; border-radius: .3em; background: var(--sl-line); overflow: hidden; margin-top: .4em; max-width: 14em; }
                #SillonConfigPage .sl-bar > i { display: block; height: 100%; background: var(--sl-accent); }
                #SillonConfigPage .sl-empty { text-align: center; padding: 2.4em 1em; }
                #SillonConfigPage .sl-empty .material-icons { font-size: 3.2em; opacity: .4; }
                #SillonConfigPage .sl-empty h3 { margin: .4em 0 .3em; }
                #SillonConfigPage .sl-empty p { margin: 0 auto; max-width: 30em; opacity: var(--sl-muted); }
                #SillonConfigPage .sl-skeleton { height: 4.4em; border-radius: .7em; margin-bottom: .7em; background: linear-gradient(90deg, var(--sl-card), rgba(128, 128, 128, .22), var(--sl-card)); background-size: 200% 100%; animation: sl-shimmer 1.3s infinite linear; }
                @keyframes sl-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
                #SillonConfigPage .sl-danger { color: var(--sl-bad); }
                #SillonConfigPage .sl-allow { display: flex; flex-wrap: wrap; gap: .5em; margin-top: .6em; }
                #SillonConfigPage .sl-tag { display: inline-flex; align-items: center; gap: .3em; padding: .2em .3em .2em .8em; border-radius: 2em; border: 1px solid var(--sl-line); font-family: monospace; font-size: .85em; }
                #SillonConfigPage .sl-tag button { all: unset; cursor: pointer; display: grid; place-items: center; border-radius: 50%; width: 1.7em; height: 1.7em; }
                #SillonConfigPage .sl-tag button:hover { background: var(--sl-card); }

                /* save bar and toast */
                #SillonConfigPage textarea#ApnsPrivateKey { display: block; width: 100%; }
                #SillonConfigPage .inputContainer > label.inputLabel { display: block; }
                #SillonConfigPage .sl-save { position: fixed; inset-inline: 0; bottom: 0; z-index: 20; display: none; align-items: center; justify-content: center; gap: 1em; padding: .8em 1em; border-top: 1px solid var(--sl-line); backdrop-filter: blur(10px); }
                #SillonConfigPage .sl-save.visible { display: flex; }
                #SillonConfigPage .sl-save > span { margin-inline-end: auto; max-width: 62em; }
                @media (min-width: 900px) { #SillonConfigPage .sl-save { inset-inline-start: 240px; } }
                #SillonConfigPage .sl-toast { position: fixed; z-index: 40; left: 50%; bottom: 5.2em; transform: translateX(-50%); max-width: calc(100vw - 2em); padding: .75em 1.2em; border-radius: .8em; background: #2b2b2b; color: #fff; box-shadow: 0 6px 24px rgba(0, 0, 0, .4); display: flex; align-items: center; gap: .6em; }
                #SillonConfigPage .sl-toast.ok .material-icons { color: #4cc664; }
                #SillonConfigPage .sl-toast.bad .material-icons { color: #ff7b72; }

                @media (max-width: 600px) {
                    #SillonConfigPage .sl-card { padding: 1em; }
                    #SillonConfigPage .sl-item { flex-wrap: wrap; }
                    #SillonConfigPage .sl-item .sl-main { flex: 1 1 8em; }
                    #SillonConfigPage .sl-item .sl-main span { white-space: normal; }
                    #SillonConfigPage .sl-side { flex-direction: row; flex-wrap: wrap; align-items: center; width: 100%; justify-content: space-between; padding-inline-start: 4.9em; }
                    #SillonConfigPage .sl-actions { justify-content: flex-start; }
                    #SillonConfigPage .sl-version { display: none; }
                    #SillonConfigPage .sl-head h1 { font-size: 1.45em; }
                    #SillonConfigPage .sl-step { gap: .7em; }
                }
            </style>

            <div class="sl-shell">
                <header class="sl-head">
                    <div class="sl-logo" aria-hidden="true"><span class="material-icons">library_music</span></div>
                    <div>
                        <h1>Sillon</h1>
                        <p class="sl-muted" data-s="tagline"></p>
                    </div>
                    <span class="sl-chip sl-version" id="VersionChip" hidden></span>
                </header>

                <div class="sl-tabs" role="tablist" id="Tabs"></div>

                <!-- Overview -->
                <section id="tab-overview" role="tabpanel" hidden>
                    <h2 class="sl-title" data-s="overviewTitle"></h2>
                    <p class="sl-lead" data-s="overviewLead"></p>
                    <div id="OverviewBody"><div class="sl-skeleton"></div><div class="sl-skeleton"></div></div>
                </section>

                <!-- Requests -->
                <section id="tab-requests" role="tabpanel" hidden>
                    <h2 class="sl-title" data-s="requestsTitle"></h2>
                    <p class="sl-lead" data-s="requestsLead"></p>
                    <div class="sl-card">
                        <div class="sl-row" style="margin-bottom: .6em;">
                            <div class="sl-chips" id="ReqFilters" role="group" style="margin: 0;"></div>
                            <div class="inputContainer sl-search">
                                <input is="emby-input" type="search" id="ReqSearch" autocomplete="off" label="Search" aria-label="Search by album, artist or person" placeholder="Search by album, artist or person" />
                            </div>
                        </div>
                        <ul class="sl-list" id="ReqList"></ul>
                        <div id="ReqEmpty" class="sl-empty" hidden></div>
                    </div>
                    <details class="sl-adv" id="TidyBox">
                        <summary data-s="tidyTitle"></summary>
                        <div class="sl-adv-body">
                            <p class="sl-muted" data-s="tidyHelp" style="margin-top: 0;"></p>
                            <div class="sl-row">
                                <span data-s="tidyBefore"></span>
                                <input is="emby-input" type="number" min="1" max="3650" id="PurgeDays" value="90" style="width: 5.5em;" aria-label="Days" />
                                <span data-s="tidyDays"></span>
                                <button is="emby-button" type="button" class="raised" id="PurgeRun"><span data-s="tidyButton"></span></button>
                            </div>
                        </div>
                    </details>
                </section>

                <!-- Lidarr -->
                <section id="tab-lidarr" role="tabpanel" class="sl-form" hidden>
                    <h2 class="sl-title" data-s="lidarrTitle"></h2>
                    <p class="sl-lead" data-s="lidarrLead"></p>
                    <div class="sl-card">
                        <div class="checkboxContainer checkboxContainer-withDescription" style="margin: 0;">
                            <label class="emby-checkbox-label">
                                <input is="emby-checkbox" type="checkbox" id="AutoAdd" />
                                <span data-s="autoAddLabel"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-s="autoAddHelp"></div>
                        </div>
                    </div>
                    <div class="sl-card" id="LidarrSteps">
                        <h3 data-s="connectTitle"></h3>
                        <p class="sl-sub" data-s="connectSub"></p>

                        <div class="sl-step todo" id="Step1">
                            <div class="sl-num">1</div>
                            <div class="sl-step-body">
                                <h4 data-s="step1Title"></h4>
                                <p data-s="step1Help"></p>
                                <div class="inputContainer">
                                    <input is="emby-input" type="text" id="LidarrUrl" label="Lidarr address" placeholder="http://lidarr:8686" autocomplete="off" />
                                    <div class="sl-field-error" data-error-for="LidarrUrl"></div>
                                </div>
                            </div>
                        </div>
                        <div class="sl-step todo" id="Step2">
                            <div class="sl-num">2</div>
                            <div class="sl-step-body">
                                <h4 data-s="step2Title"></h4>
                                <p data-s="step2Help"></p>
                                <div class="inputContainer">
                                    <input is="emby-input" type="password" id="LidarrApiKey" label="API key" autocomplete="new-password" spellcheck="false" />
                                </div>
                                <div class="checkboxContainer" id="LidarrClearKeyBox" hidden>
                                    <label class="emby-checkbox-label">
                                        <input is="emby-checkbox" type="checkbox" id="LidarrClearKey" />
                                        <span data-s="clearKey"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="sl-step todo" id="Step3">
                            <div class="sl-num">3</div>
                            <div class="sl-step-body">
                                <h4 data-s="step3Title"></h4>
                                <p data-s="step3Help"></p>
                                <div class="sl-row">
                                    <button is="emby-button" type="button" class="raised" id="LidarrTest"><span data-s="testButton"></span></button>
                                    <span id="LidarrTestResult" role="status"></span>
                                </div>
                            </div>
                        </div>
                        <div class="sl-step locked" id="Step4">
                            <div class="sl-num">4</div>
                            <div class="sl-step-body">
                                <h4 data-s="step4Title"></h4>
                                <p data-s="step4Help"></p>
                                <div class="selectContainer">
                                    <label class="selectLabel" for="LidarrQualityProfileId" data-s="qualityLabel"></label>
                                    <select is="emby-select" id="LidarrQualityProfileId" class="emby-select-withcolor emby-select"></select>
                                    <div class="fieldDescription" data-s="qualityHelp"></div>
                                </div>
                                <div class="selectContainer">
                                    <label class="selectLabel" for="LidarrRootFolder" data-s="folderLabel"></label>
                                    <select is="emby-select" id="LidarrRootFolder" class="emby-select-withcolor emby-select"></select>
                                    <div class="fieldDescription" data-s="folderHelp"></div>
                                </div>
                            </div>
                        </div>

                        <details class="sl-adv">
                            <summary data-s="advanced"></summary>
                            <div class="sl-adv-body">
                                <div class="selectContainer" style="max-width: 32em;">
                                    <label class="selectLabel" for="LidarrMetadataProfileId" data-s="metadataLabel"></label>
                                    <select is="emby-select" id="LidarrMetadataProfileId" class="emby-select-withcolor emby-select"></select>
                                    <div class="fieldDescription" data-s="metadataHelp"></div>
                                </div>
                                <h4 style="margin: 1.4em 0 .2em;" data-s="webhookTitle"></h4>
                                <p class="sl-muted" data-s="webhookHelp" style="margin-top: 0;"></p>
                                <div class="inputContainer" style="max-width: 32em;">
                                    <input is="emby-input" type="text" id="WebhookBase" label="Jellyfin address, as Lidarr reaches it" />
                                    <div class="fieldDescription" data-s="webhookBaseHelp"></div>
                                </div>
                                <div class="inputContainer" style="max-width: 32em;">
                                    <input is="emby-input" type="password" id="WebhookUrl" label="Link to paste into Lidarr" readonly />
                                    <div class="fieldDescription" data-s="webhookSecretHelp"></div>
                                </div>
                                <div class="sl-row">
                                    <button is="emby-button" type="button" class="raised" id="WebhookCopy"><span data-s="webhookCopy"></span></button>
                                </div>
                            </div>
                        </details>
                    </div>
                </section>

                <!-- Notifications -->
                <section id="tab-notifications" role="tabpanel" class="sl-form" hidden>
                    <h2 class="sl-title" data-s="notifTitle"></h2>
                    <p class="sl-lead" data-s="notifLead"></p>
                    <div id="NotifStatus"></div>
                    <div class="sl-card">
                        <h3 id="PushModeTitle" data-s="modeTitle"></h3>
                        <p class="sl-sub" data-s="modeSub"></p>
                        <div role="radiogroup" aria-labelledby="PushModeTitle">
                            <div class="sl-mode">
                                <label class="radio-label-block">
                                    <input is="emby-radio" type="radio" id="PushModeRelay" name="PushMode" value="relay" />
                                    <span data-s="modeRelay"></span>
                                </label>
                                <div class="fieldDescription radioFieldDescription" data-s="modeRelayHelp"></div>
                            </div>
                            <div class="sl-mode">
                                <label class="radio-label-block">
                                    <input is="emby-radio" type="radio" id="PushModeDirect" name="PushMode" value="direct" />
                                    <span data-s="modeDirect"></span>
                                </label>
                                <div class="fieldDescription radioFieldDescription" data-s="modeDirectHelp"></div>
                            </div>

                        window.require(['toast'], function (t) { t(text); });
                        shown = true;
                    }

                if (shown) { return; }
                var old = page.querySelector('.sl-toast');
                if (old) { old.remove(); }
                var node = h('div', { class: 'sl-toast ' + (kind || ''), role: 'status' }, [icon(kind === 'bad' ? 'error' : 'check_circle'), h('span', { text: text })]);
                page.appendChild(node);
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () { node.remove(); }, kind === 'bad' ? 6000 : 3500);

            function ago(value) {
                if (!value) { return ''; }
                var then = new Date(value).getTime();
                if (isNaN(then)) { return ''; }
                var s = Math.max(0, Math.round((Date.now() - then) / 1000));
                if (s < 60) { return 'just now'; }
                var m = Math.round(s / 60);
                if (m < 60) { return m + (m === 1 ? ' minute ago' : ' minutes ago'); }
                var hr = Math.round(m / 60);
                if (hr < 24) { return hr + (hr === 1 ? ' hour ago' : ' hours ago'); }
                var d = Math.round(hr / 24);
                if (d < 30) { return d + (d === 1 ? ' day ago' : ' days ago'); }
                return new Date(value).toLocaleDateString();

                });
                el('AllowEmpty').textContent = allowEntries.length ? '' : S.allowNone;
            }

            function addAllowEntry() {
                var input = el('AllowInput');
                var value = input.value.trim().toLowerCase();
                var error = el('AllowError');
                if (value === '') { error.textContent = S.allowEnter; return; }
                if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(value)) { error.textContent = S.allowBad; return; }
                if (allowEntries.map(function (e) { return e.toLowerCase(); }).indexOf(value) >= 0) { error.textContent = S.allowDup; return; }
                allowEntries.push(value);
                input.value = '';
                error.textContent = '';
                renderAllowList();
                setDirty(true);
                input.focus();
            }

            function webhookUrl() {
                var base = el('WebhookBase').value.trim().replace(/\/+$/, '');
                return base + '/Sillon/webhooks/lidarr?secret=' + encodeURIComponent(config.WebhookSecret || '');
            }

            function fillForm(c) {
                config = c;
                el('ExposeToApps').checked = c.ExposeToApps !== false;
                el('RequestTimeoutDays').value = c.RequestTimeoutDays;
                el('NotFoundYetAfterDays').value = c.NotFoundYetAfterDays || 3;
                el('SearchTracks').checked = c.SearchTracks !== false;
                el('HideSingles').checked = c.HideSingles !== false;
                el('HideEps').checked = c.HideEps === true;
                el('JellyfinPathPrefix').value = c.JellyfinPathPrefix || '';
                el('LidarrPathPrefix').value = c.LidarrPathPrefix || '';
                parseAllowList(c.CatalogAllowList);
                renderAllowList();

                el('AutoAdd').checked = c.FulfillmentMode === 'Lidarr';
                el('LidarrUrl').value = c.LidarrUrl || '';
                var hasKey = c.LidarrApiKey === MASK;
                el('LidarrApiKey').value = '';
                el('LidarrApiKey').placeholder = hasKey ? S.keySavedPlaceholder : '';
                el('LidarrClearKeyBox').hidden = !hasKey;
                el('LidarrClearKey').checked = false;
                fillSelect('LidarrQualityProfileId', [], function (p) { return p.id; }, function (p) { return p.name; }, c.LidarrQualityProfileId || '', 'Not chosen');
                fillSelect('LidarrMetadataProfileId', [], function (p) { return p.id; }, function (p) { return p.name; }, c.LidarrMetadataProfileId || '', 'Not chosen');
                fillSelect('LidarrRootFolder', [], function (f) { return f.path; }, function (f) { return f.path; }, c.LidarrRootFolder || '', 'Not chosen');
                el('WebhookBase').value = ApiClient.serverAddress().replace(/\/+$/, '');
                el('WebhookUrl').value = webhookUrl();
                lidarrTested = false;
                say('LidarrTestResult', '');
                updateSteps();

                el('MaxActiveRequestsPerUser').value = c.MaxActiveRequestsPerUser || 0;
                el('MaxRequestsPerUserPerDay').value = c.MaxRequestsPerUserPerDay || 0;
                el('ExemptAdminsFromLimits').checked = c.ExemptAdminsFromLimits !== false;

                // a configuration saved before the relay existed has no mode: it keeps sending the way it always did
                var legacy = !!c.ApnsEnabled || c.ApnsPrivateKey === MASK || !!c.ApnsKeyId;
                setMode(c.PushMode || (legacy ? 'direct' : 'relay'));
                el('PushRelayUrl').value = c.PushRelayUrl || '';
                el('ApnsEnabled').checked = !!c.ApnsEnabled;
                el('ApnsKeyId').value = c.ApnsKeyId || '';
                el('ApnsTeamId').value = c.ApnsTeamId || '';
                el('ApnsTopic').value = c.ApnsTopic || '';
                var hasApnsKey = c.ApnsPrivateKey === MASK;
                el('ApnsPrivateKey').value = '';
                el('ApnsPrivateKey').placeholder = hasApnsKey ? S.keySavedPlaceholder : '';
                el('ApnsKeyHint').textContent = S.keyFileHint;
                el('ApnsClearKeyBox').hidden = !hasApnsKey;
                el('ApnsClearKey').checked = false;
                dirty = false;
                updateSaveBar();
            }

            function readForm() {
                config.ExposeToApps = el('ExposeToApps').checked;
                config.FulfillmentMode = el('AutoAdd').checked ? 'Lidarr' : 'Manual';
                config.RequestTimeoutDays = parseInt(el('RequestTimeoutDays').value, 10);
                config.NotFoundYetAfterDays = parseInt(el('NotFoundYetAfterDays').value, 10);
                config.SearchTracks = el('SearchTracks').checked;
                config.HideSingles = el('HideSingles').checked;
                config.HideEps = el('HideEps').checked;
                config.JellyfinPathPrefix = el('JellyfinPathPrefix').value.trim();
                config.LidarrPathPrefix = el('LidarrPathPrefix').value.trim();
                config.CatalogAllowList = allowComments.concat(allowEntries).join('\n');

                config.LidarrUrl = el('LidarrUrl').value.trim();
                var typedKey = el('LidarrApiKey').value.trim();
                var hasKey = !el('LidarrClearKeyBox').hidden;
                config.LidarrApiKey = el('LidarrClearKey').checked ? '' : (typedKey || (hasKey ? MASK : ''));
                config.LidarrQualityProfileId = parseInt(el('LidarrQualityProfileId').value, 10) || 0;
                config.LidarrMetadataProfileId = parseInt(el('LidarrMetadataProfileId').value, 10) || 0;
                config.LidarrRootFolder = el('LidarrRootFolder').value || '';

                config.MaxActiveRequestsPerUser = parseInt(el('MaxActiveRequestsPerUser').value, 10) || 0;
                config.MaxRequestsPerUserPerDay = parseInt(el('MaxRequestsPerUserPerDay').value, 10) || 0;
                config.ExemptAdminsFromLimits = el('ExemptAdminsFromLimits').checked;

                config.PushMode = currentMode();
                config.PushRelayUrl = el('PushRelayUrl').value.trim();
                config.ApnsEnabled = el('ApnsEnabled').checked;
                config.ApnsKeyId = el('ApnsKeyId').value.trim();
                config.ApnsTeamId = el('ApnsTeamId').value.trim();
                config.ApnsTopic = el('ApnsTopic').value.trim();
                var typedApns = el('ApnsPrivateKey').value.trim();
                var hasApns = !el('ApnsClearKeyBox').hidden;
                config.ApnsPrivateKey = el('ApnsClearKey').checked ? '' : (typedApns || (hasApns ? MASK : ''));
            }

            function validate() {
                var problems = [];
                function bad(id, message, tab) { problems.push({ id: id, message: message, tab: tab }); }
                var url = el('LidarrUrl').value.trim();
                if (url !== '' && !/^https?:\/\/\S+$/i.test(url)) { bad('LidarrUrl', 'Start the address with http:// or https://', 'lidarr'); }
                var hasKey = el('LidarrApiKey').value.trim() !== '' || (!el('LidarrClearKeyBox').hidden && !el('LidarrClearKey').checked);
                if (el('AutoAdd').checked && (url === '' || !hasKey)) { bad('LidarrUrl', 'Automatic adding needs the Lidarr address and key. Fill in steps 1 and 2, or turn it off.', 'lidarr'); }

                function intIn(id, min, max, tab) {
                    var raw = el(id).value.trim();
                    var n = Number(raw);
                    if (raw === '' || !isFinite(n) || Math.floor(n) !== n || n < min || n > max) { bad(id, 'Enter a whole number from ' + min + ' to ' + max + '.', tab); }
                }
                intIn('RequestTimeoutDays', 1, 365, 'settings');
                intIn('NotFoundYetAfterDays', 1, 365, 'settings');
                intIn('MaxActiveRequestsPerUser', 0, 1000, 'settings');
                intIn('MaxRequestsPerUserPerDay', 0, 1000, 'settings');

                var jf = el('JellyfinPathPrefix').value.trim();
                var ld = el('LidarrPathPrefix').value.trim();
                if (jf !== '' && jf.charAt(0) !== '/') { bad('JellyfinPathPrefix', 'Start with a slash, like /data/music.', 'settings'); }
                if (ld !== '' && ld.charAt(0) !== '/') { bad('LidarrPathPrefix', 'Start with a slash, like /music.', 'settings'); }
                if ((jf === '') !== (ld === '')) { bad(jf === '' ? 'JellyfinPathPrefix' : 'LidarrPathPrefix', 'Fill in both folders, or leave both empty.', 'settings'); }

                var relayUrl = el('PushRelayUrl').value.trim();
                if (currentMode() === 'relay' && !/^https?:\/\/\S+$/i.test(relayUrl)) { bad('PushRelayUrl', 'Start the address with https://', 'notifications'); }
                if (currentMode() === 'direct' && el('ApnsEnabled').checked) {
                    var hasApns = el('ApnsPrivateKey').value.trim() !== '' || (!el('ApnsClearKeyBox').hidden && !el('ApnsClearKey').checked);
                    if (!hasApns) { bad('ApnsPrivateKey', 'Paste the key file content, or turn notifications off.', 'notifications'); }
                    if (!/^[A-Za-z0-9]{10}$/.test(el('ApnsKeyId').value.trim())) { bad('ApnsKeyId', 'A key ID is 10 letters and digits.', 'notifications'); }
                    if (!/^[A-Za-z0-9]{10}$/.test(el('ApnsTeamId').value.trim())) { bad('ApnsTeamId', 'A team ID is 10 letters and digits.', 'notifications'); }
                }
                return problems;
            }

            function showProblems(problems) {
                all('[data-error-for]').forEach(function (box) { box.textContent = ''; });
                problems.forEach(function (p) {
                    var box = page.querySelector('[data-error-for="' + p.id + '"]');
                    if (box) {
                        if (box.textContent === '') { box.textContent = p.message; }
                        var details = box.closest('details');
                        if (details) { details.open = true; }
                    }
                });
            }

            function save() {
                var problems = validate();
                showProblems(problems);
                if (problems.length) {
                    say('SaveMessage', S.needAttention(problems.length), 'bad');
                    var here = problems.filter(function (p) { return p.tab === current; });
                    if (!here.length) { showTab(problems[0].tab); }
                    return;
                }
                say('SaveMessage', S.saving);
                readForm();
                el('SaveButton').disabled = true;
                ApiClient.updatePluginConfiguration(PluginId, config).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                    return ApiClient.getPluginConfiguration(PluginId);
                }).then(function (c) {
                    fillForm(c);
                    health = null;
                    toast(S.saved, 'ok');
                    if (current === 'lidarr') { refreshLidarrTab(); }
                    if (current === 'notifications') { loadNotifications(); }
                }, function () {
                    say('SaveMessage', S.saveFailed, 'bad');
                    toast(S.saveFailed, 'bad');
                }).then(function () { el('SaveButton').disabled = false; });
            }

            // ---- overview

            function statusCard(iconName, title, chipNode, text, ctaLabel, ctaTab) {
                var card = h('div', { class: 'sl-card' }, [
                    h('div', { class: 'sl-card-head' }, [icon(iconName), h('span', { text: title })]),
                    h('div', {}, [chipNode]),
                    h('p', { class: 'sl-muted', text: text })
                ]);
                if (ctaLabel) { card.appendChild(h('div', { class: 'sl-cta' }, [button(ctaLabel, function () { showTab(ctaTab); })])); }
                return card;
            }

            function lidarrSummary(r) {
                var l = r.lidarr;
                if (!l.configured) {
                    return r.mode === 'lidarr'
                        ? { chip: chip('bad', 'Not connected', 'error'), text: 'Automatic adding is on, but Lidarr is not set up yet.', cta: 'Set up Lidarr' }
                        : { chip: chip('', 'Not used', 'remove_circle_outline'), text: 'Requests are added by hand. Connect Lidarr to let Sillon do it for you.', cta: 'Set up Lidarr' };
                }
                if (!l.reachable) { return { chip: chip('bad', 'Can\'t reach Lidarr', 'error'), text: l.message || 'Lidarr did not answer.', cta: 'Fix the connection' }; }
                return { chip: chip('ok', 'Connected', 'check_circle'), text: 'Lidarr ' + (l.version || '') + ' is answering.' + (r.mode === 'lidarr' ? ' New requests are added automatically.' : ' Automatic adding is turned off.'), cta: null };
            }

            function notifSummary(r) {
                var p = r.push;
                if (p.mode === 'off') { return { chip: chip('', 'Off', 'notifications_off'), text: 'People are not told when their album is ready.', cta: 'Turn on' }; }
                if (p.mode === 'relay') {
                    if (p.relay && p.relay.banned) { return { chip: chip('bad', 'Blocked', 'error'), text: S.relayBanned, cta: 'See details' }; }
                    return { chip: chip('ok', 'Working', 'check_circle'), text: 'Through the Sillon relay. ' + plural(p.devices, 'phone is', 'phones are') + ' registered to receive notifications.', cta: null };
                }
                if (p.enabled) { return { chip: chip('ok', 'Working', 'check_circle'), text: plural(p.devices, 'phone is', 'phones are') + ' registered to receive notifications.', cta: null }; }
                if (p.turnedOn) { return { chip: chip('warn', 'Needs a key', 'warning'), text: 'Notifications are on, but the Apple key is missing or incomplete.', cta: 'Finish setup' }; }
                return { chip: chip('', 'Off', 'notifications_off'), text: 'People are not told when their album is ready.', cta: 'Turn on' };
            }

            function renderOverview(r) {
                var body = el('OverviewBody');
                body.innerHTML = '';
                var req = r.requests || {};
                var failed = req.failed || 0;
                el('VersionChip').textContent = 'Version ' + r.version;
                el('VersionChip').hidden = false;

                if (failed > 0) {
                    body.appendChild(h('div', { class: 'sl-note bad' }, [icon('error_outline'), h('div', {}, [
                        h('b', { text: plural(failed, 'request needs', 'requests need') + ' your attention' }),
                        h('div', { class: 'sl-small', text: 'Sillon could not get ' + (failed === 1 ? 'this album' : 'these albums') + '. You can retry or remove ' + (failed === 1 ? 'it' : 'them') + '.' })
                    ]), button('Review', function () { reqFilter = 'failed'; showTab('requests'); })]));
                }

                var l = lidarrSummary(r);
                var n = notifSummary(r);
                body.appendChild(h('div', { class: 'sl-grid' }, [
                    statusCard('cloud_download', 'Automatic downloads', l.chip, l.text, l.cta, 'lidarr'),
                    statusCard('notifications', 'Notifications', n.chip, n.text, n.cta, 'notifications')
                ]));

                var active = (req.requested || 0) + (req.downloading || 0);
                var total = active + (req.available || 0) + failed + (req.cancelled || 0);
                var statCard = h('div', { class: 'sl-card' }, [h('div', { class: 'sl-card-head', style: 'margin-bottom: .8em;' }, [icon('queue_music'), h('span', { text: 'Requests' })])]);
                if (total === 0) {
                    statCard.appendChild(h('p', { class: 'sl-muted', text: 'Nobody has asked for an album yet. Requests show up here as soon as someone makes one in the Sillon app.' }));
                } else {
                    function stat(value, label, filter, warn) {
                        var b = h('button', { type: 'button', class: 'sl-stat' + (warn && value > 0 ? ' warn' : '') }, [h('b', { text: String(value) }), h('span', { text: label })]);
                        b.addEventListener('click', function () { reqFilter = filter; showTab('requests'); });
                        return b;
                    }
                    statCard.appendChild(h('div', { class: 'sl-stats' }, [
                        stat(req.requested || 0, 'Requested', 'requested'),
                        stat(req.downloading || 0, 'Downloading', 'downloading'),
                        stat(req.available || 0, 'Available', 'available'),
                        stat(failed, 'Failed', 'failed', true)
                    ]));
                }
                body.appendChild(statCard);

                if (!r.lidarr.configured && !r.push.turnedOn && total === 0) {
                    body.appendChild(h('div', { class: 'sl-note' }, [icon('lightbulb'), h('div', {}, [
                        h('b', { text: 'Getting started' }),
                        h('div', { class: 'sl-small', text: 'Connect Lidarr so requested albums are added for you, and turn on notifications so people know when to listen. Both are optional.' })
                    ])]));
                }
                updateTabBadge(failed);
            }

            function updateTabBadge(failed) {
                var b = el('tabbtn-requests');
                var dot = b.querySelector('.sl-dot');
                if (failed > 0 && !dot) { b.appendChild(h('span', { class: 'sl-dot', title: 'Some requests failed' })); }
                if (!failed && dot) { dot.remove(); }
            }

            function fetchHealth() {
                return api('GET', 'Sillon/Admin/Health').then(function (r) { health = r; return r; });
            }

            function loadOverview() {
                if (!health) {
                    el('OverviewBody').innerHTML = '';
                    el('OverviewBody').appendChild(h('div', { class: 'sl-skeleton' }));
                    el('OverviewBody').appendChild(h('div', { class: 'sl-skeleton' }));
                }
                return fetchHealth().then(renderOverview, function () {
                    el('OverviewBody').innerHTML = '';
                    el('OverviewBody').appendChild(h('div', { class: 'sl-note bad' }, [icon('error_outline'), h('div', { text: 'Could not load the status. Reload the page to try again.' })]));
                });
            }

            // ---- Lidarr

            function hasLidarrKey() {
                return el('LidarrApiKey').value.trim() !== '' || (!el('LidarrClearKeyBox').hidden && !el('LidarrClearKey').checked);
            }

            function updateSteps() {
                var urlOk = /^https?:\/\/\S+$/i.test(el('LidarrUrl').value.trim());
                var keyOk = hasLidarrKey();
                function mark(id, state) { var s = el(id); s.classList.remove('done', 'todo', 'locked'); s.classList.add(state); s.querySelector('.sl-num').textContent = state === 'done' ? '✓' : s.querySelector('.sl-num').getAttribute('data-n'); }
                ['Step1', 'Step2', 'Step3', 'Step4'].forEach(function (id, i) { el(id).querySelector('.sl-num').setAttribute('data-n', String(i + 1)); });
                mark('Step1', urlOk ? 'done' : 'todo');
                mark('Step2', keyOk ? 'done' : 'todo');
                mark('Step3', lidarrTested ? 'done' : (urlOk && keyOk ? 'todo' : 'locked'));
                mark('Step4', lidarrTested ? 'done' : 'locked');
                el('LidarrTest').disabled = !(urlOk && keyOk);
                var optionsOn = lidarrTested || el('LidarrQualityProfileId').options.length > 1 || !!config.LidarrQualityProfileId;
                el('Step4').classList.toggle('locked', !optionsOn);
                if (optionsOn && !lidarrTested) { el('Step4').classList.add('todo'); }
            }

            function applyOptions(r) {
                fillSelect('LidarrQualityProfileId', r.qualityProfiles, function (p) { return p.id; }, function (p) { return p.name; }, el('LidarrQualityProfileId').value || config.LidarrQualityProfileId, 'Not chosen');
                fillSelect('LidarrMetadataProfileId', r.metadataProfiles, function (p) { return p.id; }, function (p) { return p.name; }, el('LidarrMetadataProfileId').value || config.LidarrMetadataProfileId, 'Not chosen');
                fillSelect('LidarrRootFolder', r.rootFolders, function (f) { return f.path; }, function (f) { return f.path; }, el('LidarrRootFolder').value || config.LidarrRootFolder, 'Not chosen');
            }

            function testLidarr(silent) {
                var url = el('LidarrUrl').value.trim();
                if (!/^https?:\/\/\S+$/i.test(url)) { say('LidarrTestResult', 'Start the address with http:// or https://', 'bad'); return Promise.resolve(); }
                say('LidarrTestResult', 'Checking…');
                var typed = el('LidarrApiKey').value.trim();
                return api('POST', 'Sillon/Lidarr/Options', { url: url, apiKey: typed || MASK }).then(function (r) {
                    lidarrTested = true;
                    var box = el('LidarrTestResult');
                    box.className = 'ok';
                    box.textContent = '';
                    box.appendChild(chip('ok', 'Connected to Lidarr ' + r.version, 'check_circle'));
                    applyOptions(r);
                    updateSteps();
                    if (!silent) { toast('Connected to Lidarr ' + r.version, 'ok'); }
                }, function (err) {
                    lidarrTested = false;
                    updateSteps();
                    return errorText(err, 'Could not reach Lidarr. Check the address and the key.').then(function (m) {
                        var box = el('LidarrTestResult');
                        box.className = 'bad';
                        box.textContent = '';
                        box.appendChild(chip('bad', m, 'error'));
                    });
                });
            }

            function refreshLidarrTab() {
                updateSteps();
                if (config.LidarrUrl && config.LidarrApiKey === MASK && !lidarrTested && !dirty) { testLidarr(true); }
            }

            function copyWebhook() {
                var input = el('WebhookUrl');
                var text = input.value;
                var done = function () { toast(S.webhookCopied, 'ok'); };
                function fallback() {
                    input.type = 'text';
                    input.select();
                    try { document.execCommand('copy'); done(); } catch (e) { toast('Select the link and copy it by hand.', 'bad'); }
                    input.type = 'password';
                }
                if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
            }

            // ---- requests

            var statusLabels = { requested: 'Requested', downloading: 'Downloading', available: 'Available', failed: 'Failed', cancelled: 'Cancelled' };
            var statusIcons = { requested: 'schedule', downloading: 'downloading', available: 'check_circle', failed: 'error', cancelled: 'block' };
            var FILTERS = [['all', 'All'], ['active', 'In progress'], ['available', 'Available'], ['failed', 'Failed']];

            function isActive(r) { return r.status === 'requested' || r.status === 'downloading'; }

            function renderFilters() {
                var box = el('ReqFilters');
                box.innerHTML = '';
                FILTERS.forEach(function (f) {
                    var b = h('button', { type: 'button', class: 'sl-pick', 'aria-pressed': reqFilter === f[0] ? 'true' : 'false', text: f[1] });
                    b.addEventListener('click', function () { reqFilter = f[0]; renderFilters(); renderRequests(); });
                    box.appendChild(b);
                });
            }

            function runAction(method, path, okText) {
                return api(method, path).then(function () {
                    toast(okText, 'ok');
                    health = null;
                    return loadRequests(true);
                }, function (err) {
                    return errorText(err, 'That did not work. Please try again.').then(function (m) { toast(m, 'bad'); });
                });
            }

            function requestRow(r, lidarrMode) {
                var cover = h('div', { class: 'sl-cover' });
                if (r.coverUrl) {
                    var img = h('img', { src: r.coverUrl, alt: '', loading: 'lazy' });
                    img.addEventListener('error', function () { cover.innerHTML = ''; cover.appendChild(icon('album')); });
                    cover.appendChild(img);
                } else { cover.appendChild(icon('album')); }

                var sub = (r.artist || 'Unknown artist') + (r.year ? ' · ' + r.year : '');
                var main = h('div', { class: 'sl-main' }, [
                    h('b', { text: r.title || 'Untitled album', title: r.title || '' }),
                    h('span', { text: sub }),
                    h('span', { text: 'Requested by ' + (r.userName || 'someone') + ' · ' + ago(r.createdAt) })
                ]);
                if (r.status === 'downloading' && r.tracksTotal) {
                    var pct = Math.min(100, Math.round(((r.tracksImported || 0) / r.tracksTotal) * 100));
                    main.appendChild(h('div', { class: 'sl-bar', role: 'progressbar', 'aria-valuenow': String(pct), 'aria-valuemin': '0', 'aria-valuemax': '100' }, [h('i', { style: 'width:' + pct + '%' })]));
                }
                if (r.status === 'failed' && r.error) { main.appendChild(h('span', { class: 'sl-wrap', text: r.error })); }

                var id = r.id;
                var actions = h('div', { class: 'sl-actions' });
                if (lidarrMode && (isActive(r) || r.status === 'failed')) {
                    actions.appendChild(button(r.status === 'failed' ? 'Try again' : 'Search again', function () { runAction('POST', 'Sillon/v1/requests/' + id + '/retry', 'Searching again.'); }));
                }
                if (!lidarrMode && isActive(r)) {
                    actions.appendChild(button('Mark as available', function () { runAction('POST', 'Sillon/v1/requests/' + id + '/available', 'Marked as available.'); }, { primary: true }));
                }
                if (isActive(r)) {
                    actions.appendChild(button('Cancel', function () {
                        if (confirm('Cancel this request?' + (lidarrMode ? ' Lidarr stops looking for the album.' : ''))) { runAction('DELETE', 'Sillon/v1/requests/' + id, 'Request cancelled.'); }
                    }));
                } else {
                    actions.appendChild(button('Remove', function () {
                        if (confirm('Remove this request from the list?')) { runAction('DELETE', 'Sillon/Admin/Requests/' + id, 'Request removed.'); }
                    }, { danger: true }));
                }
                var side = h('div', { class: 'sl-side' }, [chip(r.status, statusLabels[r.status] || r.status, statusIcons[r.status]), actions]);
                return h('li', { class: 'sl-item' }, [cover, main, side]);
            }

            function renderRequests() {
                var text = el('ReqSearch').value.trim().toLowerCase();
                var lidarrMode = config.FulfillmentMode === 'Lidarr';
                var rows = requests.filter(function (r) {
                    if (reqFilter === 'active' && !isActive(r)) { return false; }
                    if (reqFilter !== 'all' && reqFilter !== 'active' && r.status !== reqFilter) { return false; }
                    return !text || (r.userName + ' ' + r.artist + ' ' + r.title).toLowerCase().indexOf(text) >= 0;
                });
                var list = el('ReqList');
                list.innerHTML = '';
                var empty = el('ReqEmpty');
                if (!requestsLoaded) {
                    for (var i = 0; i < 3; i++) { list.appendChild(h('li', { class: 'sl-skeleton' })); }
                    empty.hidden = true;
                    return;
                }
                rows.forEach(function (r) { list.appendChild(requestRow(r, lidarrMode)); });
                empty.hidden = rows.length > 0;
                empty.innerHTML = '';
                if (!rows.length) {
                    if (!requests.length) {
                        empty.appendChild(icon('queue_music'));
                        empty.appendChild(h('h3', { text: 'No requests yet' }));
                        empty.appendChild(h('p', { text: 'A request is an album someone asks you to add, straight from the Sillon app. When one comes in, it appears here and you can follow it until it is ready to play.' }));
                    } else {
                        empty.appendChild(icon('search_off'));
                        empty.appendChild(h('h3', { text: 'Nothing matches' }));
                        empty.appendChild(h('p', { text: 'Try another filter or a different search.' }));
                    }
                }
            }

            function loadRequests(keep) {
                renderFilters();
                if (!requestsLoaded) { renderRequests(); }
                return api('GET', 'Sillon/v1/requests').then(function (r) {
                    requests = (r.requests || []).slice().sort(function (x, y) { return new Date(y.createdAt) - new Date(x.createdAt); });
                    requestsLoaded = true;
                    renderRequests();
                    updateTabBadge(requests.filter(function (x) { return x.status === 'failed'; }).length);
                }, function () {
                    requestsLoaded = true;
                    el('ReqList').innerHTML = '';
                    el('ReqEmpty').hidden = false;
                    el('ReqEmpty').innerHTML = '';
                    el('ReqEmpty').appendChild(icon('cloud_off'));
                    el('ReqEmpty').appendChild(h('h3', { text: 'Could not load the requests' }));
                    el('ReqEmpty').appendChild(h('p', { text: 'Check that the server is running, then open this tab again.' }));
                });
            }

            function purge() {
                var days = parseInt(el('PurgeDays').value, 10);
                if (!(days >= 1 && days <= 3650)) { toast('Enter a number of days from 1 to 3650.', 'bad'); return; }
                if (!confirm('Remove every finished request older than ' + days + ' days?')) { return; }
                api('POST', 'Sillon/Admin/Requests/Purge', { olderThanDays: days }).then(function (r) {
                    toast(r.removed === 0 ? 'Nothing to tidy up.' : plural(r.removed, 'request', 'requests') + ' removed.', 'ok');
                    health = null;
                    return loadRequests(true);
                }, function (err) {
                    errorText(err, 'Tidying up failed.').then(function (m) { toast(m, 'bad'); });
                });
            }

            // ---- notifications

            var platformNames = { ios: 'iPhone or iPad', ipados: 'iPad', android: 'Android phone' };

            function currentMode() {
                var picked = page.querySelector('input[name="PushMode"]:checked');
                return picked ? picked.value : 'relay';
            }

            function setMode(mode) {
                var id = { relay: 'PushModeRelay', direct: 'PushModeDirect', off: 'PushModeOff' }[mode] || 'PushModeRelay';
                el(id).checked = true;
                showMode();
            }

            // only the part of the page that belongs to the chosen mode is shown
            function showMode() {
                var mode = currentMode();
                el('RelayPanel').hidden = mode !== 'relay';
                el('DirectPanel').hidden = mode !== 'direct';
                el('DirectAdvanced').hidden = mode !== 'direct';
                el('PushTestMe').disabled = mode === 'off';
            }

            function renderRelayInfo(p) {
                var box = el('RelayInfo');
                box.innerHTML = '';
                var relay = p.relay;
                if (!relay) { return; }
                var rows = [
                    h('div', { class: 'sl-small' }, [h('b', { text: S.relayServerId + ': ' }), h('code', { text: relay.kid })]),
                    h('div', { class: 'sl-small sl-muted', text: S.relayServerIdHelp }),
                    h('div', { class: 'sl-small', style: 'margin-top: .6em;' }, [h('b', { text: S.relayLast + ': ' }), relay.lastAt ? (relay.lastStatus + ', ' + ago(relay.lastAt) + ' (' + S.relayCounts(relay.sent, relay.refused) + ')') : S.relayNever])
                ];
                if (relay.banned) { rows.push(h('div', { class: 'sl-note bad', style: 'margin-top: .8em;' }, [icon('error'), h('div', { text: S.relayBanned })])); }
                else if (relay.blockedUntil) { rows.push(h('div', { class: 'sl-note', style: 'margin-top: .8em;' }, [icon('schedule'), h('div', { text: S.relayQuota(new Date(relay.blockedUntil).toLocaleString()) })])); }
                rows.forEach(function (row) { box.appendChild(row); });
            }

            function loadNotifications() {
                return Promise.all([fetchHealth(), api('GET', 'Sillon/Admin/Devices')]).then(function (r) {
                    var p = r[0].push;
                    var box = el('NotifStatus');
                    box.innerHTML = '';
                    renderRelayInfo(p);
                    if (p.mode === 'off') {
                        // nothing to report: the choice above says it
                    } else if (p.mode === 'relay') {
                        if (p.relay && p.relay.banned) {
                            box.appendChild(h('div', { class: 'sl-note bad' }, [icon('error'), h('div', {}, [h('b', { text: 'Blocked by the relay' }), h('div', { class: 'sl-small', text: S.relayBanned })])]));
                        } else if (!p.devices) {
                            box.appendChild(h('div', { class: 'sl-note' }, [icon('info'), h('div', {}, [h('b', { text: 'Ready' }), h('div', { class: 'sl-small', text: S.relayNoPhones })])]));
                        } else {
                            box.appendChild(h('div', { class: 'sl-note ok' }, [icon('check_circle'), h('div', {}, [h('b', { text: 'Notifications are working' }), h('div', { class: 'sl-small', text: 'Send yourself a test to see one arrive.' })])]));
                        }
                    } else if (p.enabled) {
                        box.appendChild(h('div', { class: 'sl-note ok' }, [icon('check_circle'), h('div', {}, [h('b', { text: 'Notifications are working' }), h('div', { class: 'sl-small', text: 'Send yourself a test to see one arrive.' })])]));
                    } else if (p.turnedOn) {
                        box.appendChild(h('div', { class: 'sl-note bad' }, [icon('warning'), h('div', {}, [h('b', { text: 'Almost there' }), h('div', { class: 'sl-small', text: 'Notifications are on, but the Apple key is missing or incomplete. Open "Advanced: Apple notification key" below to finish.' })])]));
                    }
                    renderDevices(r[1].users || []);
                }, function () {
                    el('DevicesList').innerHTML = '';
                    toast('Could not load the notification status.', 'bad');
                });
            }

            function renderDevices(users) {
                var list = el('DevicesList');
                list.innerHTML = '';
                var count = 0;
                users.forEach(function (u) {
                    u.devices.forEach(function (d) {
                        count++;
                        var name = u.userName || 'Deleted user';
                        var device = (platformNames[(d.platform || '').toLowerCase()] || d.platform || 'Phone') + (d.env === 'sandbox' ? ' (test build)' : '');
                        var remove = button('Remove', function () {
                            if (!confirm('Stop sending notifications to this phone? It comes back by itself the next time the app opens.')) { return; }
                            api('DELETE', 'Sillon/Admin/Devices/' + d.id).then(function () { toast('Phone removed.', 'ok'); health = null; return loadNotifications(); }, function (err) {
                                errorText(err, 'Could not remove the phone.').then(function (m) { toast(m, 'bad'); });
                            });
                        }, { danger: true, label: 'Remove ' + device + ' of ' + name });
                        list.appendChild(h('li', { class: 'sl-item' }, [
                            h('div', { class: 'sl-avatar', 'aria-hidden': 'true', text: (name.charAt(0) || '?').toUpperCase() }),
                            h('div', { class: 'sl-main' }, [h('b', { text: name }), h('span', { text: device + (d.mode === 'relay' ? ' · via the relay' : '') + ' · last seen ' + ago(d.updatedAt) })]),
                            h('div', { class: 'sl-side' }, [remove])
                        ]));
                    });
                });
                var empty = el('DevicesEmpty');
                empty.hidden = count > 0;
                empty.innerHTML = '';
                if (!count) {
                    empty.appendChild(icon('phone_iphone'));
                    empty.appendChild(h('h3', { text: S.devicesEmptyTitle }));
                    empty.appendChild(h('p', { text: S.devicesEmptyText }));
                }
            }

            function sendTest() {
                if (dirty) { say('PushTestResult', 'Save your changes first: the test uses the saved settings.', 'bad'); return; }
                say('PushTestResult', 'Sending…');
                el('PushTestMe').disabled = true;
                api('POST', 'Sillon/Push/Test').then(function (r) {
                    var devices = r.devices || [];
                    if (!devices.length) { say('PushTestResult', S.testNoPhone, 'bad'); return; }
                    var failed = devices.filter(function (d) { return d.result !== 'sent'; });
                    if (failed.length && r.mode === 'relay') {
                        var why = S.testRelayWhy[failed[0].reason] || failed[0].reason;
                        say('PushTestResult', S.testRelayRefused + (why ? ': ' + why : '') + '.', 'bad');
                    } else if (failed.length) { say('PushTestResult', 'Apple refused the notification' + (failed[0].reason ? ' (' + failed[0].reason + ')' : '') + '. Check the key in the Advanced section.', 'bad'); } else { say('PushTestResult', 'Sent! It should arrive on your phone in a moment.', 'ok'); toast('Test notification sent.', 'ok'); }
                }, function (err) {
                    errorText(err, 'The test failed.').then(function (m) { say('PushTestResult', m, 'bad'); });
                }).then(function () { showMode(); });
            }

            // ---- wiring

            page.querySelector('.sl-shell').addEventListener('input', function (e) {
                var t = e.target;
                if (!t || !t.id) { return; }
                if (['LidarrUrl', 'LidarrApiKey'].indexOf(t.id) >= 0) { lidarrTested = false; say('LidarrTestResult', ''); updateSteps(); }
            });
            ['input', 'change'].forEach(function (type) {
                page.querySelector('.sl-shell').addEventListener(type, function (e) {
                    var t = e.target;
                    if (!t || !t.id || ['ReqSearch', 'PurgeDays', 'AllowInput', 'WebhookBase', 'WebhookUrl'].indexOf(t.id) >= 0) { return; }
                    if (['INPUT', 'SELECT', 'TEXTAREA'].indexOf(t.tagName) >= 0) { setDirty(true); updateSteps(); }
                });
            });
            page.querySelector('.sl-shell').addEventListener('change', function (e) {
                if (e.target && e.target.name === 'PushMode') { showMode(); }
            });
            el('WebhookBase').addEventListener('input', function () { el('WebhookUrl').value = webhookUrl(); });
            el('AllowAdd').addEventListener('click', addAllowEntry);
            el('AllowInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addAllowEntry(); } });
            el('LidarrTest').addEventListener('click', function () { testLidarr(false); });
            el('WebhookCopy').addEventListener('click', copyWebhook);
            el('ReqSearch').addEventListener('input', renderRequests);
            el('PurgeRun').addEventListener('click', purge);
            el('PushTestMe').addEventListener('click', sendTest);
            el('SaveButton').addEventListener('click', save);
            el('DiscardButton').addEventListener('click', function () {
                ApiClient.getPluginConfiguration(PluginId).then(function (c) { fillForm(c); showProblems([]); toast('Changes discarded.', 'ok'); });
            });

            buildTabs();
            applyStrings();
            renderAllowList();

            function detectTheme() {
                // Jellyfin themes set the text colour, so a dark text colour means a light theme.
                var fg = (window.getComputedStyle(page).color || '').match(/\d+(\.\d+)?/g) || [];
                var light = fg.length >= 3 && (0.299 * fg[0] + 0.587 * fg[1] + 0.114 * fg[2]) < 128;
                page.setAttribute('data-theme', light ? 'light' : 'dark');
                el('SaveBar').style.background = light ? 'rgba(250, 250, 250, .96)' : 'rgba(16, 16, 16, .96)';
            }

            page.addEventListener('pageshow', function () {
                detectTheme();
                Dashboard.showLoadingMsg();
                var tab = 'overview';
                try { tab = sessionStorage.getItem('sillon-tab') || 'overview'; } catch (e) { /* storage may be blocked */ }
                ApiClient.getPluginConfiguration(PluginId).then(function (c) {
                    fillForm(c);
                    showTab(tab);
                    Dashboard.hideLoadingMsg();
                }, function () {
                    Dashboard.hideLoadingMsg();
                    showTab('overview');
                    toast(S.loadFailed, 'bad');
                });
            });
        })();
    </script>
</div>
</body>
</html>
